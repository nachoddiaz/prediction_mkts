# config/kalshi.yaml
# ───────────────────
# Parámetros del modelo y riesgo para Kalshi.
#
# IMPORTANTE: los valores de model/ son INICIALES — no calibrados.
# Ejecuta research/02_calibration.ipynb después de acumular
# al menos 1 semana de datos históricos para obtener valores reales.
#
# update_model_params() del notebook escribe en este archivo
# y añade last_calibrated automáticamente.

name: kalshi

# Categorías a monitorizar. Lista vacía = todas.
active_categories:
  - crypto
  - politics
  - economics

max_markets: 50
http_timeout: 10

# ---------------------------------------------------------------------------
# Parámetros de riesgo
# Ajustar manualmente según tu capital y apetito de riesgo.
# Empezar conservador — puedes subir gradualmente.
# ---------------------------------------------------------------------------
risk:
  # γ — aversión al riesgo. Mayor γ = spreads más anchos, menos fills.
  # Rango típico en prediction markets: 0.05 - 0.5
  gamma: 0.1

  # Inventario máximo antes de near-resolution rules (§6.4 MATH.md)
  q_max: 10

  # Halt automático si el P&L del día cae por debajo de esto (USD)
  max_daily_loss: 100.0

  # Pérdida máxima por posición individual (USD)
  max_position_loss: 20.0

# ---------------------------------------------------------------------------
# Parámetros del modelo
# VALORES INICIALES — calibrar con research/02_calibration.ipynb
# last_calibrated se añade automáticamente al calibrar
# ---------------------------------------------------------------------------
model:
  # GLFT §3 — calibrar por MLE sobre fill rates históricos
  kappa: 1.5   # decay del arrival rate
  A: 0.1       # baseline arrival rate

  # Cartea-Jaimungal §4 — calibrar por AR(1) sobre serie μ̂_t
  phi: 1.0     # mean-reversion speed del drift latente
  eta: 0.05    # volatilidad del drift latente
  rho: 0.1     # correlación Δp_t ↔ Δμ̂_t

  # Pesos señal §4.6 — calibrar por Ridge regression
  # w_news y w_onchain son 0 hasta implementar esas señales
  w_obi: 1.0
  w_news: 0.0
  w_onchain: 0.0
