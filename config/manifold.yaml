# config/manifold.yaml
# ─────────────────────
# Parameters for Manifold (a play-money sandbox).
#
# More aggressive than production:
#   Manifold es el entorno de desarrollo — queremos actividad frecuente
#   the goal here is to validate the pipeline, not to be conservative.
#   Sin riesgo financiero real.

name: manifold

active_categories: []   # monitor everything — this is a sandbox

max_markets: 20
http_timeout: 10

risk:
  # Low γ → tight spreads → more fills → more data to calibrate with
  gamma: 0.05
  # High q_max → more near-resolution situations to exercise
  q_max: 20
  # No real limits — play money
  max_daily_loss: 999999.0
  max_position_loss: 999999.0

model:
  kappa: 1.5
  A: 0.1
  phi: 1.0
  eta: 0.05
  rho: 0.1
  w_obi: 1.0
  w_news: 0.0
  w_onchain: 0.0
