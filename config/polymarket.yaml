# config/polymarket.yaml
# ───────────────────────
# Model and risk parameters for Polymarket.
#
# Diferencias clave respecto a Kalshi:
#   - On-chain settlement on Polygon (~2s latency)
#   - No CFTC limits — more volume in certain markets
#   - Mayor riesgo de contraparte (smart contracts) → q_max menor
#   - Typically higher κ — a deeper CLOB

name: polymarket

active_categories:
  - crypto
  - politics

max_markets: 30
http_timeout: 15   # a longer timeout, for Polygon latency

risk:
  # γ_I — CARA inventory risk aversion (kept separate from Kelly, per v2.1)
  # Slightly higher, for smart-contract risk
  gamma_I: 0.15
  q_max: 5
  max_daily_loss: 75.0
  max_position_loss: 15.0

  # Annualised cost of capital ρ_c — §8.1 MATH.md v2.1
  capital_cost_rho: 0.07

  # b_U — USDC basis spread (solo Polymarket) — §8.2 MATH.md v2.1
  usdc_basis_bu: 0.001

  # Minimum spread tick size, in price space — §4.1 MATH.md v2.1
  tick_size: 0.01

model:
  # GLFT — κ is typically higher on Polymarket (a deeper book)
  kappa_p: 2.0
  kappa_x: null  # derived from kappa_p on calibration
  A: 0.08

  # Cartea-Jaimungal
  phi: 1.2
  eta: 0.06
  rho: 0.12

  # New v2.1 parameters
  rho_mu: 0.5               # signal discount (§5)
  phi_kelly: 0.25           # Kelly fractional multiplier (§8)
  oracle_reversal_r: 0.001  # probabilidad reversal UMA (§8.1)
  tau_star_hours: 24.0      # escala temporal q_max (§8.3)

  # Signal weights
  w_obi: 1.0
  w_news: 0.0
  w_onchain: 0.0
