# config/polymarket.yaml
# ───────────────────────
# Parámetros del modelo y riesgo para Polymarket.
#
# Diferencias clave respecto a Kalshi:
#   - Liquidación on-chain en Polygon (~2s latencia)
#   - Sin límites CFTC — más volumen en ciertos mercados
#   - Mayor riesgo de contraparte (smart contracts) → q_max menor
#   - κ típicamente mayor — CLOB más profundo

name: polymarket

active_categories:
  - crypto
  - politics

max_markets: 30
http_timeout: 15   # mayor timeout por latencia de Polygon

risk:
  # γ_I — CARA inventory risk aversion (separado de Kelly según v2.1)
  # Ligeramente mayor por riesgo de smart contract
  gamma_I: 0.15
  q_max: 5
  max_daily_loss: 75.0
  max_position_loss: 15.0

  # Coste de capital anualizado ρ_c — §8.1 MATH.md v2.1
  capital_cost_rho: 0.07

  # b_U — USDC basis spread (solo Polymarket) — §8.2 MATH.md v2.1
  usdc_basis_bu: 0.001

  # Tick size mínimo del spread en precio — §4.1 MATH.md v2.1
  tick_size: 0.01

model:
  # GLFT — κ típicamente mayor en Polymarket (libro más profundo)
  kappa_p: 2.0
  kappa_x: null  # se calcula desde kappa_p al calibrar
  A: 0.08

  # Cartea-Jaimungal
  phi: 1.2
  eta: 0.06
  rho: 0.12

  # Nuevos parámetros v2.1
  rho_mu: 0.5               # descuento de señal (§5)
  phi_kelly: 0.25           # Kelly fractional multiplier (§8)
  oracle_reversal_r: 0.001  # probabilidad reversal UMA (§8.1)
  tau_star_hours: 24.0      # escala temporal q_max (§8.3)

  # Pesos señal
  w_obi: 1.0
  w_news: 0.0
  w_onchain: 0.0
